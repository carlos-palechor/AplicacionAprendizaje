<header class="navbar-publica">
  <div class="marca">
    <div
      class="marca__icono marca__icono--logo"
      role="img"
      aria-label="Logo de Apoyo academico y profesional"
    ></div>
    <span>Apoyo academico y profesional</span>
  </div>

  <form class="buscador-navbar" (submit)="$event.preventDefault(); seleccionarPrimerResultado()">
    <label for="busqueda-navbar">Buscar</label>
    <input
      id="busqueda-navbar"
      type="search"
      placeholder="Buscar servicios, profesionales"
      [value]="busqueda"
      (input)="buscar($any($event.target).value)"
      (focus)="buscar(busqueda)"
      (blur)="ocultarResultados()"
    />

    @if (resultados.length > 0) {
      <div class="buscador-navbar__resultados">
        @for (servicio of resultados; track servicio.id_servicio) {
          <button type="button" (mousedown)="seleccionarServicio(servicio)">
            <strong>{{ servicio.titulo }}</strong>
            <span>
              {{ servicio.categoria_servicio.nombre_categoria }}
              -
              {{ servicio.profesional.nombres }} {{ servicio.profesional.apellidos }}
            </span>
          </button>
        }
      </div>
    }
  </form>

  <nav class="navbar-publica__acciones" aria-label="Navegacion publica">
    <a href="#servicios">Explorar</a>
    <a routerLink="/auth" [queryParams]="{ modo: 'login' }">Iniciar Sesion</a>
    <a class="boton boton--primario" routerLink="/auth" [queryParams]="{ modo: 'registro', tipo: 'profesional' }">Soy profesional</a>
  </nav>
</header>
